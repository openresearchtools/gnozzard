name: Build Debian package

on:
  workflow_dispatch:
    inputs:
      publication:
        description: What to publish after a successful build
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - prerelease
          - release
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debian-13:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman when needed
        shell: bash
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes podman
          fi
          podman --version

      - name: Build and check in Debian 13
        shell: bash
        run: |
          mkdir -p dist
          podman run --rm \
            --volume "$PWD:/source:ro,Z" \
            --volume "$PWD/dist:/out:Z" \
            debian:trixie \
            bash -euxo pipefail -c '
              mkdir -p /work/gnozzard
              cp -a /source/. /work/gnozzard/
              cd /work/gnozzard
              apt-get update
              apt-get install --yes --no-install-recommends ca-certificates git lintian
              ./scripts/install-build-deps.sh
              ./scripts/vendor-cargo.sh
              ./scripts/check.sh
              ./scripts/build-deb.sh
              lintian --tag-display-limit 0 /work/gnozzard_*.deb
              cp /work/gnozzard_*.deb /out/
              cd /out
              for package in gnozzard_*.deb; do
                sha256sum "$package" > "$package.sha256"
                dpkg-deb --info "$package" >/dev/null
                sha256sum --check "$package.sha256"
              done
            '

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnozzard-debian-13-amd64
          if-no-files-found: error
          path: |
            dist/gnozzard_*.deb
            dist/gnozzard_*.deb.sha256

  publish-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publication != 'artifact-only'
    needs: debian-13
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Debian package
        uses: actions/download-artifact@v4
        with:
          name: gnozzard-debian-13-amd64
          path: release-download

      - name: Prepare versioned and latest-download assets
        shell: bash
        run: |
          set -euo pipefail
          versioned_deb="$(find release-download -maxdepth 1 -type f -name 'gnozzard_*_amd64.deb' -print -quit)"
          test -n "$versioned_deb"
          test -f "$versioned_deb.sha256"
          changelog_version="$(dpkg-parsechangelog -S Version)"
          package_version="$(dpkg-deb --field "$versioned_deb" Version)"
          package_name="$(dpkg-deb --field "$versioned_deb" Package)"
          package_architecture="$(dpkg-deb --field "$versioned_deb" Architecture)"
          test "$package_name" = gnozzard
          test "$package_architecture" = amd64
          if [[ "$package_version" != "$changelog_version" ]]; then
            echo "Package version $package_version does not match changelog $changelog_version" >&2
            exit 1
          fi
          (
            cd release-download
            sha256sum --check "$(basename "$versioned_deb.sha256")"
          )

          mkdir -p release-assets
          cp "$versioned_deb" release-assets/
          cp "$versioned_deb.sha256" release-assets/
          cp "$versioned_deb" release-assets/gnozzard_amd64.deb
          (
            cd release-assets
            sha256sum gnozzard_amd64.deb > gnozzard_amd64.deb.sha256
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION: ${{ inputs.publication }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(dpkg-parsechangelog -S Version)"
          tag="v$version"
          title="Gnozzard $version"

          while IFS= read -r published_version; do
            if dpkg --compare-versions "$version" lt "$published_version"; then
              echo "Refusing to publish $version below existing $published_version" >&2
              exit 1
            fi
          done < <(
            gh release list --limit 100 --json tagName \
              --jq '.[].tagName | select(startswith("v")) | ltrimstr("v")'
          )

          if [[ "$PUBLICATION" == prerelease ]]; then
            prerelease=true
            latest=false
          else
            prerelease=false
            latest=true
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            tagged_sha="$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
                --jq '.object.sha'
            )"
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              echo "Refusing to replace $tag with different source." >&2
              echo "Increase the version in debian/changelog first." >&2
              exit 1
            fi
            gh release edit "$tag" \
              --title "$title" \
              --target "$GITHUB_SHA" \
              --prerelease="$prerelease" \
              --latest="$latest"
            gh release upload "$tag" release-assets/* --clobber
          else
            arguments=(
              "$tag"
              release-assets/*
              --target "$GITHUB_SHA"
              --title "$title"
              --generate-notes
            )
            if [[ "$PUBLICATION" == prerelease ]]; then
              arguments+=(--prerelease)
            else
              arguments+=(--latest)
            fi
            gh release create "${arguments[@]}"
          fi
