name: Build Debian package

on:
  workflow_dispatch:
    inputs:
      publication:
        description: What to publish after a successful build
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - prerelease
          - release
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'gnozzard-manual' || format('gnozzard-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  prepare-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publication != 'artifact-only'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select and commit the next package version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(dpkg-parsechangelog -S Version)"
          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic package version, got $current_version" >&2
            exit 1
          fi

          newest_release=""
          while IFS= read -r released_version; do
            if [[ ! "$released_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            if [[ -z "$newest_release" ]] || \
              dpkg --compare-versions "$released_version" gt "$newest_release"; then
              newest_release="$released_version"
            fi
          done < <(
            gh release list --limit 100 --json tagName \
              --jq '.[].tagName | select(startswith("v")) | ltrimstr("v")'
          )

          next_version="$current_version"
          if [[ -n "$newest_release" ]] && \
            dpkg --compare-versions "$current_version" le "$newest_release"; then
            IFS=. read -r major minor patch <<< "$newest_release"
            next_version="$major.$minor.$((patch + 1))"
          fi

          if [[ "$next_version" != "$current_version" ]]; then
            temporary_changelog="$(mktemp)"
            {
              printf 'gnozzard (%s) unstable; urgency=medium\n\n' "$next_version"
              printf '  * Automated release version bump.\n\n'
              printf ' -- Open Research Tools <openresearchtools@users.noreply.github.com>  %s\n\n' "$(date -R)"
              cat debian/changelog
            } > "$temporary_changelog"
            mv "$temporary_changelog" debian/changelog

            git config user.name openresearchtools
            git config user.email 229047507+openresearchtools@users.noreply.github.com
            git add debian/changelog
            git commit -m "Bump package version to $next_version"
            git push origin HEAD:main
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

  build-context:
    needs: prepare-release
    if: >-
      always() &&
      (needs.prepare-release.result == 'success' ||
      needs.prepare-release.result == 'skipped')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.build-context.outputs.sha }}
      version: ${{ steps.build-context.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Record exact build source and version
        id: build-context
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(dpkg-parsechangelog -S Version)" >> "$GITHUB_OUTPUT"

  build-deb:
    needs: build-context
    if: >-
      always() &&
      needs.build-context.result == 'success'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-context.outputs.sha }}

      - name: Install Podman when needed
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          test "$(dpkg --print-architecture)" = "$ARCHITECTURE"
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes podman
          fi
          podman --version

      - name: Build and check in Debian 13
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          mkdir -p dist
          podman run --rm \
            --arch "$ARCHITECTURE" \
            --env ARCHITECTURE \
            --volume "$PWD:/source:ro,Z" \
            --volume "$PWD/dist:/out:Z" \
            debian:trixie \
            bash -euxo pipefail -c '
              mkdir -p /work/gnozzard
              cp -a /source/. /work/gnozzard/
              cd /work/gnozzard
              apt-get update
              apt-get install --yes --no-install-recommends ca-certificates git lintian
              ./scripts/install-build-deps.sh
              ./scripts/vendor-cargo.sh
              ./scripts/check.sh
              ./scripts/build-deb.sh
              lintian --tag-display-limit 0 \
                /work/gnozzard_*.deb \
                /work/gnozzard-resources_*.deb
              for package_name in gnozzard gnozzard-resources; do
                package="$(find /work -maxdepth 1 -type f -name "${package_name}_*_${ARCHITECTURE}.deb" -print -quit)"
                test -n "$package"
                test "$(dpkg-deb --field "$package" Package)" = "$package_name"
                test "$(dpkg-deb --field "$package" Architecture)" = "$ARCHITECTURE"
              done
              main_package="$(find /work -maxdepth 1 -type f -name "gnozzard_*_${ARCHITECTURE}.deb" -print -quit)"
              resources_package="$(find /work -maxdepth 1 -type f -name "gnozzard-resources_*_${ARCHITECTURE}.deb" -print -quit)"
              package_version="$(dpkg-deb --field "$main_package" Version)"
              dpkg-deb --field "$main_package" Depends \
                | grep --fixed-strings "gnozzard-resources (= $package_version)"
              main_contents="$(mktemp)"
              resources_contents="$(mktemp)"
              main_files="$(mktemp)"
              resources_files="$(mktemp)"
              dpkg-deb --contents "$main_package" > "$main_contents"
              dpkg-deb --contents "$resources_package" > "$resources_contents"
              awk "{print \$6}" "$main_contents" | grep -v "/$" | sort > "$main_files"
              awk "{print \$6}" "$resources_contents" | grep -v "/$" | sort > "$resources_files"
              test -z "$(comm -12 "$main_files" "$resources_files")"
              grep --fixed-strings \
                "./usr/share/doc/gnozzard-resources/copyright" \
                "$resources_contents"
              cp /work/gnozzard_*.deb /work/gnozzard-resources_*.deb /out/
              cd /out
              for package in gnozzard_*.deb gnozzard-resources_*.deb; do
                sha256sum "$package" > "$package.sha256"
                dpkg-deb --info "$package" >/dev/null
                sha256sum --check "$package.sha256"
              done
            '

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnozzard-debian-13-${{ matrix.architecture }}
          if-no-files-found: error
          path: |
            dist/gnozzard_*.deb
            dist/gnozzard_*.deb.sha256
            dist/gnozzard-resources_*.deb
            dist/gnozzard-resources_*.deb.sha256

  publish-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publication != 'artifact-only'
    needs: [build-context, build-deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-context.outputs.sha }}

      - name: Download verified Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: gnozzard-debian-13-*
          merge-multiple: true
          path: release-download

      - name: Prepare latest-download asset
        shell: bash
        run: |
          set -euo pipefail
          changelog_version="$(dpkg-parsechangelog -S Version)"
          mkdir -p release-assets
          for architecture in amd64 arm64; do
            for expected_package in gnozzard gnozzard-resources; do
              versioned_deb="$(find release-download -maxdepth 1 -type f -name "${expected_package}_*_${architecture}.deb" -print -quit)"
              test -n "$versioned_deb"
              test -f "$versioned_deb.sha256"
              package_version="$(dpkg-deb --field "$versioned_deb" Version)"
              package_name="$(dpkg-deb --field "$versioned_deb" Package)"
              package_architecture="$(dpkg-deb --field "$versioned_deb" Architecture)"
              test "$package_name" = "$expected_package"
              test "$package_architecture" = "$architecture"
              if [[ "$package_version" != "$changelog_version" ]]; then
                echo "Package version $package_version does not match changelog $changelog_version" >&2
                exit 1
              fi
              (
                cd release-download
                sha256sum --check "$(basename "$versioned_deb.sha256")"
              )
              cp "$versioned_deb" "release-assets/${expected_package}_${architecture}.deb"
            done
          done
          test "$(find release-assets -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION: ${{ inputs.publication }}
          RELEASE_SHA: ${{ needs.build-context.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(dpkg-parsechangelog -S Version)"
          tag="v$version"
          title="Gnozzard $version"
          install_notes="$(cat <<EOF
          <!-- openresearchtools-apt-install:start -->
          ## Install on Debian 13+ or Ubuntu 24.04/26.04+

          For the first Open Research Tools installation on this system:

          \`\`\`bash
          wget -qO /tmp/keyring.deb https://keyring.openresearchtools.com && sudo apt install -y /tmp/keyring.deb && sudo apt update && sudo apt install -y gnozzard=$version
          \`\`\`

          If the Open Research Tools APT repository is already configured:

          \`\`\`bash
          sudo apt update && sudo apt install -y gnozzard=$version
          \`\`\`

          APT selects an available system architecture and installs the matching
          \`gnozzard-resources\` package automatically when required.
          <!-- openresearchtools-apt-install:end -->
          EOF
          )"

          while IFS= read -r published_version; do
            if dpkg --compare-versions "$version" lt "$published_version"; then
              echo "Refusing to publish $version below existing $published_version" >&2
              exit 1
            fi
          done < <(
            gh release list --limit 100 --json tagName \
              --jq '.[].tagName | select(startswith("v")) | ltrimstr("v")'
          )

          if [[ "$PUBLICATION" == prerelease ]]; then
            prerelease=true
            latest=false
          else
            prerelease=false
            latest=true
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            tagged_sha="$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
                --jq '.object.sha'
            )"
            if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
              echo "Refusing to replace $tag with different source." >&2
              echo "Increase the version in debian/changelog first." >&2
              exit 1
            fi
            notes_arguments=()
            if [[ "$PUBLICATION" == release ]]; then
              existing_body="$(gh release view "$tag" --json body --jq '.body // ""')"
              if ! grep -Fq '<!-- openresearchtools-apt-install:start -->' <<<"$existing_body"; then
                notes_arguments+=(--notes "$install_notes"$'\n\n'"$existing_body")
              fi
            fi
            gh release edit "$tag" \
              --title "$title" \
              --target "$RELEASE_SHA" \
              --prerelease="$prerelease" \
              --latest="$latest" \
              "${notes_arguments[@]}"
            gh release upload "$tag" release-assets/* --clobber
          else
            arguments=(
              "$tag"
              release-assets/*
              --target "$RELEASE_SHA"
              --title "$title"
              --generate-notes
            )
            if [[ "$PUBLICATION" == prerelease ]]; then
              arguments+=(--prerelease)
            else
              arguments+=(--latest --notes "$install_notes")
            fi
            gh release create "${arguments[@]}"
          fi
